# Build the catalog from the organization, render the site, publish to Pages.
#
# The site has no content of its own to keep in sync: every tool's card and
# detail page is built from that tool's tool.json, its latest release and the
# images the manifest points at. So this runs on a schedule as well as on a
# push, and a tool's release workflow can wake it immediately by sending a
# `tool-released` repository dispatch.
name: publish

on:
  push:
    branches: [main]
  schedule:
    # Hourly, off the hour: a release that does not dispatch still shows up
    # within the hour.
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [tool-released]

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: install
        run: npm ci

      - name: build the catalog
        env:
          # Lifts the API rate limit. Read access to public repositories in
          # this organization is all it is used for.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run catalog

      - name: build the site
        env:
          SITE_URL: ${{ vars.SITE_DOMAIN != '' && format('https://{0}', vars.SITE_DOMAIN) || 'https://tui-tools.github.io' }}
        run: npx astro build

      # The custom domain is opt-in and inert until the owner sets the
      # SITE_DOMAIN repository variable. See the README: the variable and a DNS
      # CNAME are the two halves, and setting only one of them breaks the site.
      - name: write CNAME
        if: vars.SITE_DOMAIN != ''
        run: echo "${{ vars.SITE_DOMAIN }}" > dist/CNAME

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # The catalog is what decides what every page says, so its hash is the
      # honest answer to "did the site's content change?". The ship job below
      # turns it into the build stamp it sends to the container host; see the
      # comment there for why that host needs to be told.
      - name: keep the catalog for the ship job
        uses: actions/upload-artifact@v7
        with:
          name: catalog
          path: src/data/catalog.json
          retention-days: 1

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Off unless the owner turns it on, and unrelated to Pages: the same site,
  # shipped to a second host.
  #
  # Quave ONE has no GitHub App installed on this organization — that is a click
  # only the owner can make — so the source is pushed rather than pulled, with
  # the documented three-step Code API: ask for a pre-signed URL, PUT the
  # tarball, say it landed. The last step triggers the build.
  #
  # Which leaves the problem this job really exists for. The site's content
  # lives outside this repository: a release in another repo changes a page here
  # with no commit to push, which is why Pages rebuilds hourly rather than only
  # on push. The container host sees the same identical source every hour and
  # reuses the image it already built — correctly, and uselessly, because the
  # catalog is baked into that image. So the tarball carries `.build-stamp`, the
  # hash of the catalog *this run* built. Identical content, identical stamp,
  # identical source: the platform reuses the image and no build minutes are
  # spent. A release upstream changes the catalog, the stamp, the source and the
  # `COPY . .` layer in one go, and the image is rebuilt with the new content.
  #
  # To turn it on, set the repository variable and the secret:
  #
  #   gh variable set QUAVE_ENV_NAME  --body tui-tools-tui-site-production
  #   gh secret   set QUAVE_API_TOKEN                # app-environment token
  #
  # Leave QUAVE_ENV_NAME unset and the job is skipped, which is the state this
  # repository is in while Pages is the only host.
  ship:
    name: ship to the container host
    needs: build
    if: vars.QUAVE_ENV_NAME != ''
    runs-on: ubuntu-latest
    env:
      API: ${{ vars.QUAVE_API_URL || 'https://api.quave.cloud/api/public/v1' }}
      ENV_NAME: ${{ vars.QUAVE_ENV_NAME }}
      TOKEN: ${{ secrets.QUAVE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: fetch the catalog this run built
        uses: actions/download-artifact@v8
        with:
          name: catalog
          path: ${{ runner.temp }}/catalog

      - name: pack the source
        run: |
          set -euo pipefail

          if [ -z "$TOKEN" ]; then
            echo "QUAVE_ENV_NAME is set but QUAVE_API_TOKEN is not; both are needed."
            exit 1
          fi

          # The stamp, and the whole reason this is not a plain redeploy call.
          sha256sum "${RUNNER_TEMP}/catalog/catalog.json" | cut -d' ' -f1 > .build-stamp

          # Reproducible flags throughout — sorted entries, a fixed mtime, no
          # owner names, and gzip without its timestamp header — so a run that
          # changed nothing produces a byte-identical tarball, which is what
          # lets the platform recognise it as the same source.
          tar --sort=name --mtime='UTC 1970-01-01' \
              --owner=0 --group=0 --numeric-owner \
              --exclude=./.git \
              --exclude=./node_modules \
              --exclude=./dist \
              --exclude=./.astro \
              -cf - . | gzip -n > "${RUNNER_TEMP}/source.tgz"

      # --fail-with-body throughout, so a 401 or a 404 stops the job and still
      # prints what the API said, rather than leaving a stale site up in silence.
      - name: upload it and trigger the build
        run: |
          set -euo pipefail

          key_response=$(curl --silent --show-error --fail-with-body \
            -X POST "${API}/app-env/request-storage-key" \
            -H "Authorization: ${TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg env "$ENV_NAME" '{envName: $env, fileExtension: "tgz"}')")

          upload_url=$(printf '%s' "$key_response" | jq -er '.uploadUrl')
          storage_key=$(printf '%s' "$key_response" | jq -er '.storageKey')

          curl --silent --show-error --fail-with-body \
            -X PUT "$upload_url" \
            -H 'Content-Type: application/x-gzip' \
            --data-binary "@${RUNNER_TEMP}/source.tgz" > /dev/null

          curl --silent --show-error --fail-with-body \
            -X POST "${API}/app-env/upload-storage-event" \
            -H "Authorization: ${TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg env "$ENV_NAME" --arg key "$storage_key" \
                    '{envName: $env, storageKey: $key}')"
