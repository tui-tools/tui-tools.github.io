# Build the catalog from the organization, render the site, publish to Pages.
#
# The site has no content of its own to keep in sync: every tool's card and
# detail page is built from that tool's tool.json, its latest release and the
# images the manifest points at. So this runs on a schedule as well as on a
# push, and a tool's release workflow can wake it immediately by sending a
# `tool-released` repository dispatch.
name: publish

on:
  push:
    branches: [main]
  schedule:
    # Hourly, off the hour: a release that does not dispatch still shows up
    # within the hour.
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [tool-released]

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: install
        run: npm ci

      - name: build the catalog
        env:
          # Lifts the API rate limit. Read access to public repositories in
          # this organization is all it is used for.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run catalog

      - name: build the site
        env:
          SITE_URL: ${{ vars.SITE_DOMAIN != '' && format('https://{0}', vars.SITE_DOMAIN) || 'https://tui-tools.github.io' }}
        run: npx astro build

      # The custom domain is opt-in and inert until the owner sets the
      # SITE_DOMAIN repository variable. See the README: the variable and a DNS
      # CNAME are the two halves, and setting only one of them breaks the site.
      - name: write CNAME
        if: vars.SITE_DOMAIN != ''
        run: echo "${{ vars.SITE_DOMAIN }}" > dist/CNAME

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Off unless the owner turns it on, and unrelated to Pages: it is the same
  # rebuild signal, sent to a second host.
  #
  # The site's content lives outside this repository — a release in another repo
  # changes the page here with no commit to push — which is why Pages is
  # rebuilt hourly rather than only on push. A container host has the same
  # problem and cannot solve it on its own: nothing in its git history changed,
  # so nothing tells it to rebuild. This job is that telling.
  #
  # Quave ONE's public API documents `POST /api/public/v1/app-env/build` for
  # exactly this. `forceNewBuild` is not optional here: without it the platform
  # sees identical source and skips the build, which is precisely the case this
  # job exists for.
  #
  # To turn it on, set the repository variables and the secret:
  #
  #   gh variable set QUAVE_REDEPLOY_URL --body https://api.quave.cloud/api/public/v1/app-env/build
  #   gh variable set QUAVE_ENV_NAME     --body tui-tools-tui-tools-site-production
  #   gh secret   set QUAVE_API_TOKEN    # an app-environment or user token
  #
  # Leave QUAVE_REDEPLOY_URL unset and the job is skipped, which is the state
  # this repository is in while Pages is still the host.
  redeploy:
    name: rebuild on the container host
    needs: build
    if: vars.QUAVE_REDEPLOY_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: trigger the build
        env:
          URL: ${{ vars.QUAVE_REDEPLOY_URL }}
          ENV_NAME: ${{ vars.QUAVE_ENV_NAME }}
          TOKEN: ${{ secrets.QUAVE_API_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$TOKEN" ] || [ -z "$ENV_NAME" ]; then
            echo "QUAVE_REDEPLOY_URL is set but QUAVE_API_TOKEN or QUAVE_ENV_NAME is not."
            echo "All three are needed; see the comment above this job."
            exit 1
          fi

          # --fail-with-body so a 401 or a 404 stops the job and still prints
          # what the API said, rather than leaving a stale site up in silence.
          curl --silent --show-error --fail-with-body \
            -X POST "$URL" \
            -H "Authorization: $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg env "$ENV_NAME" '{envName: $env, forceNewBuild: true}')"
