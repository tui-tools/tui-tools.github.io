# The headers every response carries.
#
# This is a separate file because of an nginx rule that is easy to get wrong:
# an `add_header` inside a location block *replaces* the ones inherited from the
# server block rather than adding to them. So every location that sets a header
# of its own has to include this too, or it silently ships without the security
# headers. Including one file in each of them keeps the list in one place.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
